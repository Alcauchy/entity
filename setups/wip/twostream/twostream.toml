[simulation]
  name    = "twostream"
  engine  = "srpic"
  runtime = 100.0

[grid]
  resolution = [512]
  extent     = [[-40.0, 40.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"]]
    particles = [["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 4.0

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 200.0

  [[particles.species]]
    label    = "e-_p"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e7

  [[particles.species]]
    label    = "e-_p"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e7

  [[particles.species]]
    label    = "e-_b"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e7

[setup]
  drift_u_1 = 0.2
  temp_1    = 1e-4
  amplitude = 1e-3
  wavenumber = 3.0

[output]
  format        = "hdf5"
  interval = 10

  [output.fields]
    quantities = ["N", "B", "E", "T0i_1", "T0i_3"]

  [output.particles]
    enable = true

  [output.spectra]
    enable = false

[diagnostics]
  colored_stdout = true
